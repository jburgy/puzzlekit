name: Publish package index

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: package-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv build --no-sources
      - run: uv run python scripts/build_package_index.py --package-name puzzlekit
      - name: Commit package index artifacts
        run: |
          if git diff --quiet -- docs/simple docs/packages; then
            echo "No package index changes to commit."
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/simple docs/packages
          version=$(uv run python - <<'PY'
          from pathlib import Path

          for line in Path("pyproject.toml").read_text(encoding="utf-8").splitlines():
              if line.startswith("version = "):
                  print(line.split('"')[1])
                  break
          PY
          )
          git commit -m "Publish puzzlekit ${version} package index"
          git push
      - run: uv sync --group docs --locked
      - run: uv run sphinx-build -W -b html docs docs/_build/html
      - run: |
          cp -R docs/simple docs/_build/html/
          cp -R docs/packages docs/_build/html/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
      - id: deployment
        uses: actions/deploy-pages@v5