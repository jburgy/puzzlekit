name: docs

on: [push]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group docs --locked
      - run: uv run sphinx-build -W -b html docs docs/_build/html
      - run: |
          if [ -d docs/simple ]; then
            cp -R docs/simple docs/_build/html/
          fi
          if [ -d docs/packages ]; then
            cp -R docs/packages docs/_build/html/
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
